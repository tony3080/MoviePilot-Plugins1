<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151519">
  <title>RSS一条龙 · 手机预览</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --bg:#f3f4f8; --surface:#fff; --text:#25262c; --muted:#777984; --blue:#2878e5; --line:#e4e5eb; --bar:rgba(243,244,248,.94); }
    @media(prefers-color-scheme:dark) { :root { --bg:#151519; --surface:#222227; --text:#f4f4f7; --muted:#aaaab5; --line:#36363f; --bar:rgba(21,21,25,.94); } }
    * { box-sizing:border-box; letter-spacing:0; }
    html { -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; overscroll-behavior:none; }
    body { margin:0; background:#e5e7ed; color:var(--text); }
    button,input,select { font:inherit; }
    button,a,select { touch-action:manipulation; }
    button { color:inherit; cursor:pointer; -webkit-user-select:none; user-select:none; border:0; }
    button:disabled { color:var(--muted); opacity:.32; cursor:default; }
    button:active:not(:disabled) { background:rgba(125,125,140,.12); }
    button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    button svg { pointer-events:none; }
    svg { width:21px; height:21px; stroke-width:1.8; flex:none; }
    h1,h2,p { margin:0; }
    .phone { width:min(100%,430px); height:100dvh; margin:auto; background:var(--bg); display:flex; flex-direction:column; isolation:isolate; }
    @media(min-width:520px) { body { display:grid; place-items:center; min-height:100dvh; } .phone { height:min(920px,94dvh); border:1px solid var(--line); border-radius:28px; overflow:hidden; box-shadow:0 12px 60px #15152024; } }
    header { display:flex; align-items:center; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px; flex:none; }
    h1 { font-size:26px; line-height:1.25; font-weight:700; }
    .subtitle { color:var(--muted); font-size:12px; margin-top:4px; }
    .header-actions { display:flex; }
    .icon-button { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:8px; background:none; color:var(--blue); flex:none; }
    .danger { color:#d94656; }
    .search { padding:4px 12px 8px; }
    .search input { width:100%; min-width:0; border:1px solid var(--line); background:var(--surface); border-radius:8px; color:var(--text); padding:10px 12px; font-size:16px; }
    .controls { flex:none; padding:0 12px; background:var(--bar); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
    #state { flex:none; width:80px; min-height:44px; border:0; background:none; color:var(--blue); font-size:16px; padding:0 2px; }
    .selection-toolbar { display:flex; align-items:center; gap:0; min-height:48px; }
    .selection-count { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .selection-count.has-selection { color:var(--blue); font-weight:600; }
    .toolbar-actions { display:flex; align-items:center; margin-left:auto; }
    @media(max-width:380px) {
      .selection-toolbar { flex-wrap:wrap; }
      .selection-count { flex-basis:100%; padding-top:4px; }
      #state { width:76px; }
    }
    main { overflow:auto; overscroll-behavior:contain; min-height:0; flex:1; padding:8px 12px 16px; }
    .media-row { position:relative; min-height:168px; display:grid; grid-template-columns:112px minmax(0,1fr); border-radius:8px; background:var(--surface); overflow:hidden; margin-bottom:10px; }
    .media-row.selected { outline:2px solid var(--blue); outline-offset:-2px; }
    .card-select { position:absolute; inset:0; background:transparent; z-index:1; border-radius:8px; width:100%; }
    .card-select:active { background:rgba(50,120,230,.06) !important; }
    .poster { position:relative; grid-column:1; grid-row:1; min-height:168px; background:#ccc; pointer-events:none; }
    .poster img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
    .media-copy { grid-column:2; grid-row:1; min-width:0; padding:12px 12px 6px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
    .media-title { font-size:16px; line-height:1.35; font-weight:650; overflow-wrap:anywhere; }
    .tag-row { display:flex; flex-wrap:wrap; align-items:flex-start; gap:4px; }
    .tag { font-size:11px; font-weight:500; line-height:1.25; border-radius:5px; padding:4px 6px; max-width:100%; overflow-wrap:anywhere; color:#696c77; background:#7e829312; border:1px solid #7e82931c; }
    .tag.blue { color:#286fc5; background:#2878e515; border-color:#2878e522; }
    .tag.cyan { color:#047f99; background:#00a6c014; border-color:#00a6c023; }
    .tag.purple { color:#8051bb; background:#905bc513; border-color:#905bc522; }
    .tag.teal { color:#138078; background:#10978b14; border-color:#10978b24; }
    .tag.orange { color:#ba6b16; background:#e3972116; border-color:#e3972126; }
    .tag.red { color:#c23c51; background:#d7465913; border-color:#d7465922; }
    .tag.green { color:#25854e; background:#32905a13; border-color:#32905a22; }
    .inventory-line { font-size:12px; line-height:1.4; color:#c23c51; }
    .inventory-line.complete { color:#25854e; }
    .card-controls { display:flex; align-items:center; margin-top:auto; position:relative; z-index:2; }
    .card-controls button { pointer-events:auto; }
    .source-button { display:flex; align-items:center; gap:4px; min-height:44px; background:none; padding:0; color:var(--blue); font-size:12px; }
    .source-button svg { width:15px; height:15px; }
    .detail-button { margin-left:auto; margin-right:-8px; }
    .source-name { min-width:0; flex:1; font-size:12px; color:var(--muted); line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .empty { padding:60px 12px; text-align:center; color:var(--muted); }
    .nav { display:grid; grid-template-columns:repeat(4,1fr); padding:5px 8px calc(6px + env(safe-area-inset-bottom,0px)); flex:none; border-top:1px solid var(--line); background:var(--bar); backdrop-filter:blur(20px); }
    .nav button { background:none; color:var(--muted); min-height:50px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:10px; border-radius:8px; }
    .nav button.active { color:var(--blue); }
    .nav button.active svg { stroke-width:2.4; }
    .metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
    .metric { border-bottom:1px solid var(--line); padding:12px 4px; }
    .metric span { display:block; font-size:12px; color:var(--muted); }
    .metric strong { display:block; font-size:24px; margin-top:6px; }
    .section-heading { font-size:16px; margin:18px 0 12px; }
    .settings-row { padding:16px 4px; border-bottom:1px solid var(--line); font-size:14px; }
    .settings-row span { display:block; margin-top:6px; color:var(--muted); font-size:12px; }
    dialog { width:min(calc(100% - 32px),380px); max-height:80dvh; overflow:auto; margin:auto; padding:22px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text); box-shadow:0 16px 80px #0003; }
    dialog::backdrop { background:#17182065; }
    dialog h2 { font-size:18px; line-height:1.4; margin-bottom:12px; }
    dialog p { font-size:14px; color:var(--muted); line-height:1.6; overflow-wrap:anywhere; }
    .dialog-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; justify-content:flex-end; }
    .dialog-actions button { min-height:44px; padding:8px 16px; border-radius:8px; background:#7e829315; color:var(--blue); }
    .dialog-actions .danger { color:#d94656; }
    .dialog-actions .confirm { background:var(--blue); color:#fff; }
    .dialog-actions .confirm.danger { background:#d94656; color:#fff; }
    .toast { position:fixed; bottom:calc(82px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:#262630; color:#fff; border-radius:8px; padding:11px 16px; font-size:13px; z-index:10; max-width:calc(100% - 32px); pointer-events:none; }
    [hidden] { display:none !important; }
    @media(hover:hover) and (pointer:fine) { button:not(:disabled):hover { background:#7e829310; } }
    @media(prefers-reduced-transparency:reduce) { .controls,.nav { backdrop-filter:none; background:var(--bg); } }
  </style>
</head>
<body>
  <section class="phone" aria-label="手机预览">
    <header>
      <div><h1 id="title">入库管理</h1><p class="subtitle">家里 NAS</p></div>
      <div class="header-actions">
        <button class="icon-button" id="search-toggle" title="搜索" aria-label="搜索"><i data-lucide="search"></i></button>
        <button class="icon-button" id="refresh" title="刷新列表" aria-label="刷新列表"><i data-lucide="refresh-cw"></i></button>
      </div>
    </header>
    <div class="search" id="search-box" hidden><input id="search" type="search" placeholder="搜索媒体" aria-label="搜索媒体"></div>
    <div class="controls" id="controls">
      <div class="selection-toolbar">
        <span class="selection-count" id="selection-count" role="status" aria-live="polite">共 4 项</span>
        <button class="icon-button" id="select-all" title="全选或取消全选" aria-label="全选或取消全选"><i data-lucide="circle-check"></i></button>
        <div class="toolbar-actions" id="toolbar-actions"></div>
        <select id="state" aria-label="状态"></select>
      </div>
    </div>
    <main id="content"></main>
    <nav class="nav" aria-label="页面">
      <button data-tab="overview"><i data-lucide="layout-dashboard"></i>总览</button>
      <button class="active" data-tab="media"><i data-lucide="archive"></i>入库</button>
      <button data-tab="qb"><i data-lucide="download"></i>qB</button>
      <button data-tab="settings"><i data-lucide="settings"></i>设置</button>
    </nav>
  </section>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="preview-assets/lucide.min.js"></script>
  <script>
    const media = [
      { id:"media-1", title:"黑狱断肠歌之砌生猪肉", state:"已识别", tone:"blue", tags:["1080p","华语电影","REMUX@U版","4.7 GB","国配"], source:"Chinese.Midnight.Express.1997.1080p.BluRay.REMUX.mkv", poster:"preview-assets/movie.jpg", existing:0, total:1, folder:true },
      { id:"media-2", title:"火影忍者：疾风传", state:"已识别", tone:"blue", tags:["第一季","1080p","日韩动漫","WEB-DL","128.4 GB","特效"], source:"Naruto.Shippuden.2007.S01.Complete.1080p.WEB-DL.H264.AAC-UBWEB", poster:"preview-assets/naruto.jpg", existing:4, total:14, folder:true },
      { id:"media-3", title:"凡人修仙传", state:"待入库", tone:"purple", tags:["第四季","2160p","国产动漫","WEB-DL","32.4 GB"], source:"A.Record.of.a.Mortals.Journey.to.Immortality.2025.S04.Complete.2160p.mkv", poster:"preview-assets/series.jpg", existing:0, total:12, folder:false },
      { id:"media-4", title:"抓特务", state:"已入库", tone:"green", tags:["2160p","华语电影","WEB-DL","6.2 GB"], source:"Catch.the.Spy.2026.2160p.WEB-DL.mkv", poster:"preview-assets/spy.jpg", existing:1, total:1, folder:true }
    ];
    const torrents = [
      { id:"qb-1", title:"凡人修仙传", state:"已识别", tone:"blue", tags:["下载中","68%","2160p","国产动漫","32.4 GB"], source:"A.Record.of.a.Mortals.Journey.to.Immortality.2025.S04.2160p.mkv", poster:"preview-assets/series.jpg" },
      { id:"qb-2", title:"火影忍者：疾风传", state:"已识别", tone:"blue", tags:["已完成","100%","1080p","日韩动漫","128.4 GB"], source:"Naruto.Shippuden.2007.S01.Complete.1080p.WEB-DL.H264.AAC-UBWEB", poster:"preview-assets/naruto.jpg" }
    ];
    let tab="media", state="", search="", toastTimer;
    const selected=new Set();
    const $=selector=>document.querySelector(selector);
    const icons=()=>window.lucide?.createIcons();
    const escapeText=text=>String(text).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const stateKey=()=>`rssallinone.preview.filters.${tab}.state`;
    function savedState() {
      try { return localStorage.getItem(stateKey())||""; } catch { return ""; }
    }
    function saveState() {
      try { localStorage.setItem(stateKey(),state); } catch {}
    }
    const records=()=>tab==="qb"?torrents:media;
    const visible=()=>records().filter(item=>(!state||item.state===state) && (!search||`${item.title} ${item.source}`.toLowerCase().includes(search.toLowerCase())));
    const selectedRows=()=>visible().filter(item=>selected.has(item.id));
    function iconButton(action,label,icon,danger=false) {
      return `<button class="icon-button ${danger?"danger":""}" data-action="${action}" title="${label}" aria-label="${label}"><i data-lucide="${icon}"></i></button>`;
    }
    function can(action) {
      const rows=selectedRows();
      if (!rows.length) return false;
      if (tab==="qb") return action==="delete-qb";
      if (action==="queue") return rows.every(item=>["已识别","已回退"].includes(item.state));
      if (["import","force_upload"].includes(action)) return rows.every(item=>["已识别","待入库","已回退"].includes(item.state));
      if (action==="delete-source") return rows.every(item=>!["已入库","入库中"].includes(item.state));
      if (["inventory","delete-links","delete-both"].includes(action)) return rows.every(item=>item.state==="已入库");
      return false;
    }
    function toolbar() {
      const n=selectedRows().length;
      $("#selection-count").textContent=n?`已选 ${n} 项`:`共 ${visible().length} 项`;
      $("#selection-count").classList.toggle("has-selection",n>0);
      $("#select-all").disabled=!visible().length;
      $("#select-all").setAttribute("aria-pressed",String(visible().length>0 && visible().every(item=>selected.has(item.id))));
      $("#toolbar-actions").innerHTML=tab==="qb"
        ?iconButton("delete-qb","删除 qB 任务","trash-2",true)
        :iconButton("queue","转待入库","inbox")+iconButton("import","入库","archive")+iconButton("force_upload","强制入库","circle-arrow-up")+iconButton("delete-source","删源","trash-2",true);
      $("#toolbar-actions").querySelectorAll("[data-action]").forEach(button=>button.disabled=!can(button.dataset.action));
      icons();
    }
    function tagTone(tag) {
      if (/^\d{3,4}p$/i.test(tag)) return "cyan";
      if (/电影|剧|动漫|^第.+季$|^特别篇/.test(tag)) return "purple";
      if (/REMUX|WEB|特效/.test(tag)) return "teal";
      if (tag==="国配") return "red";
      if (tag==="下载中") return "orange";
      if (tag==="已完成") return "green";
      return "";
    }
    function mediaRow(item) {
      const picked=selected.has(item.id);
      return `<article class="media-row ${picked?"selected":""}" data-id="${item.id}">
        <button class="card-select" data-select="${item.id}" aria-label="选择：${escapeText(item.title)}" aria-pressed="${picked}"></button>
        <div class="poster"><img src="${item.poster}" alt="" loading="eager"></div>
        <div class="media-copy">
          <h2 class="media-title">${escapeText(item.title)}</h2>
          <div class="tag-row"><span class="tag ${item.tone}">${item.state}</span>${item.tags.map(tag=>`<span class="tag ${tagTone(tag)}">${escapeText(tag)}</span>`).join("")}</div>
          ${item.total?`<div class="inventory-line ${item.existing>=item.total?"complete":""}">${item.folder?"目录已存在":"目录未建立"}（${item.existing}/${item.total}）</div>`:""}
          <div class="card-controls"><p class="source-name">${escapeText(item.source)}</p>
            <button class="icon-button detail-button" data-detail="${item.id}" aria-label="详情：${escapeText(item.title)}" title="查看详情"><i data-lucide="info"></i></button></div>
        </div>
      </article>`;
    }
    function renderList() {
      const scroll=$("#content").scrollTop;
      $("#content").innerHTML=visible().map(mediaRow).join("")||'<p class="empty">暂无记录</p>';
      $("#content").scrollTop=scroll;
      toolbar();
    }
    function page(next) {
      tab=next; state=savedState(); search=""; selected.clear();
      $("#state").innerHTML=["",...(tab==="qb"?["已识别","未识别"]:["已识别","未识别","待入库","已入库","已存在","已回退"])].map(value=>`<option value="${value}">${value||"全部"}</option>`).join("");
      if (![...$("#state").options].some(option=>option.value===state)) state="";
      $("#state").value=state;
      $("#search").value=""; $("#search-box").hidden=true;
      $("#title").textContent=({media:"入库管理",qb:"qB 管理",overview:"总览",settings:"设置"})[tab];
      $("#controls").hidden=!["media","qb"].includes(tab);
      $("#search-toggle").hidden=!["media","qb"].includes(tab);
      document.querySelectorAll(".nav button").forEach(button=>button.classList.toggle("active",button.dataset.tab===tab));
      $("#content").scrollTop=0;
      if (["media","qb"].includes(tab)) renderList();
      else if (tab==="overview") {
        $("#content").innerHTML=`<div class="metric-grid"><div class="metric"><span>媒体记录</span><strong>${media.length}</strong></div><div class="metric"><span>qB 任务</span><strong>${torrents.length}</strong></div><div class="metric"><span>待入库</span><strong>${media.filter(item=>item.state==="待入库").length}</strong></div><div class="metric"><span>运行状态</span><strong>就绪</strong></div></div>`;
      } else $("#content").innerHTML='<div class="settings-row">实例<span>家里 NAS</span></div><div class="settings-row">预览数据<span>本页操作只影响演示记录</span></div><button class="source-button" id="reset-demo">重新加载演示数据</button>';
      icons();
    }
    function showToast(text) {
      clearTimeout(toastTimer); $("#toast").textContent=text; $("#toast").hidden=false;
      toastTimer=setTimeout(()=>$("#toast").hidden=true,2200);
    }
    function dialog(title,body,buttons) {
      $("#dialog").innerHTML=`<h2 id="dialog-title">${escapeText(title)}</h2>${body}<div class="dialog-actions">${buttons}</div>`;
      icons(); $("#dialog").showModal();
    }
    function batchAction(action) {
      if (!can(action)) return;
      const title=({"queue":"转待入库","import":"入库","force_upload":"强制入库","delete-source":"删除源文件","delete-qb":"删除 qB 任务","delete-links":"删除硬链接","delete-both":"删除源文件和硬链接"})[action];
      const danger=action.startsWith("delete");
      const message=action==="force_upload"?`对选中的 ${selectedRows().length} 项优先尝试秒传，无法秒传时继续真实上传。`:action==="delete-qb"?"删除选中的 qB 任务，保留下载文件。":danger?"删除选中记录对应的文件。此预览仅操作演示数据。":`对选中的 ${selectedRows().length} 项执行${title}？`;
      if ($("#dialog").open) $("#dialog").close();
      dialog(`${title} · ${selectedRows().length} 项`,`<p>${message}</p>`,`<button data-close>取消</button><button class="confirm ${danger?"danger":""}" data-execute="${action}">确认${title}</button>`);
    }
    function execute(action) {
      if (!can(action)) return;
      const rows=selectedRows(), n=rows.length;
      if (action==="queue") rows.forEach(item=>{item.state="待入库";item.tone="purple";});
      if (["import","force_upload"].includes(action)) rows.forEach(item=>{item.state="已入库";item.tone="green";item.existing=item.total;item.folder=true;});
      if (["delete-qb","delete-source","delete-both"].includes(action)) {
        const list=records(); for (let index=list.length-1;index>=0;index--) if (selected.has(list[index].id)) list.splice(index,1);
      }
      if (action==="delete-links") rows.forEach(item=>{item.state="已回退";item.tone="red";});
      selected.clear(); $("#dialog").close(); renderList(); showToast(`已处理 ${n} 项`);
    }
    document.addEventListener("click",event=>{
      const button=event.target.closest("button"); if(!button||button.disabled) return;
      if(button.dataset.tab) return page(button.dataset.tab);
      if(button.dataset.select) {
        const key=button.dataset.select; selected.has(key)?selected.delete(key):selected.add(key); return renderList();
      }
      if(button.dataset.detail) {
        const item=records().find(row=>row.id===button.dataset.detail);
        return dialog(item.title,`<div class="tag-row">${item.tags.map(tag=>`<span class="tag ${tagTone(tag)}">${escapeText(tag)}</span>`).join("")}</div><p style="margin-top:12px">${escapeText(item.source)}</p>`, '<button data-close>完成</button>');
      }
      if(button.dataset.action) return batchAction(button.dataset.action);
      if(button.dataset.execute) return execute(button.dataset.execute);
      if(button.dataset.confirm) return batchAction(button.dataset.confirm);
      if(button.hasAttribute("data-close")) return $("#dialog").close();
      if(button.id==="clear-selection") {selected.clear();$("#dialog").close();return renderList();}
      if(button.id==="select-all") {
        const rows=visible(); if(rows.every(item=>selected.has(item.id))) selected.clear(); else rows.forEach(item=>selected.add(item.id)); return renderList();
      }
      if(button.id==="search-toggle") {$("#search-box").hidden=!$("#search-box").hidden;if(!$("#search-box").hidden) $("#search").focus();}
      if(button.id==="refresh") {selected.clear();if(["media","qb"].includes(tab)) renderList();showToast("已刷新演示记录");}
      if(button.id==="reset-demo") location.reload();
    });
    $("#state").addEventListener("change",event=>{state=event.target.value;saveState();selected.clear();renderList();});
    $("#search").addEventListener("input",event=>{search=event.target.value;selected.clear();renderList();});
    page("media");
  </script>
</body>
</html>
