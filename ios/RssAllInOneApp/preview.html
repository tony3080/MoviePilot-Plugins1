<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151519">
  <title>RSS一条龙 · 手机预览</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --bg:#f3f4f8; --surface:#fff; --text:#25262c; --muted:#777984; --blue:#2878e5; --line:#e4e5eb; --bar:rgba(243,244,248,.94); }
    @media(prefers-color-scheme:dark) { :root { --bg:#151519; --surface:#222227; --text:#f4f4f7; --muted:#aaaab5; --line:#36363f; --bar:rgba(21,21,25,.94); } }
    * { box-sizing:border-box; letter-spacing:0; }
    html { -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; overscroll-behavior:none; }
    body { margin:0; background:#e5e7ed; color:var(--text); }
    button,input,select { font:inherit; }
    button,a,select { touch-action:manipulation; }
    button { color:inherit; cursor:pointer; -webkit-user-select:none; user-select:none; border:0; }
    button:disabled { color:var(--muted); opacity:.32; cursor:default; }
    button:active:not(:disabled) { background:rgba(125,125,140,.12); }
    button:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    button svg { pointer-events:none; }
    svg { width:21px; height:21px; stroke-width:1.8; flex:none; }
    h1,h2,p { margin:0; }
    .phone { width:min(100%,430px); height:100dvh; margin:auto; background:var(--bg); display:flex; flex-direction:column; isolation:isolate; }
    @media(min-width:520px) { body { display:grid; place-items:center; min-height:100dvh; } .phone { height:min(920px,94dvh); border:1px solid var(--line); border-radius:28px; overflow:hidden; box-shadow:0 12px 60px #15152024; } }
    header { display:flex; align-items:center; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px; flex:none; }
    h1 { font-size:26px; line-height:1.25; font-weight:700; }
    .subtitle { color:var(--muted); font-size:12px; margin-top:4px; }
    .header-actions { display:flex; }
    .icon-button { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:8px; background:none; color:var(--blue); flex:none; }
    .danger { color:#d94656; }
    .search { padding:4px 12px 8px; }
    .search input { width:100%; min-width:0; border:1px solid var(--line); background:var(--surface); border-radius:8px; color:var(--text); padding:10px 12px; font-size:16px; }
    .controls { flex:none; padding:0 12px; background:var(--bar); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
    #state { flex:none; width:80px; min-height:44px; border:0; background:none; color:var(--blue); font-size:16px; padding:0 2px; }
    .selection-toolbar { display:flex; align-items:center; gap:0; min-height:48px; }
    .selection-count { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .selection-count.has-selection { color:var(--blue); font-weight:600; }
    .toolbar-actions { display:flex; align-items:center; margin-left:auto; }
    @media(max-width:380px) {
      .selection-toolbar { flex-wrap:wrap; }
      .selection-count { flex-basis:100%; padding-top:4px; }
      #state { width:76px; }
    }
    main { overflow:auto; overscroll-behavior:contain; min-height:0; flex:1; padding:8px 12px 16px; }
    .media-row { position:relative; min-height:210px; display:grid; grid-template-columns:140px minmax(0,1fr); border-radius:8px; background:var(--surface); overflow:hidden; margin-bottom:10px; }
    .media-row.selected { outline:2px solid var(--blue); outline-offset:-2px; }
    .card-select { position:absolute; inset:0; background:transparent; z-index:1; border-radius:8px; width:100%; }
    .card-select:active { background:rgba(50,120,230,.06) !important; }
    .poster { position:relative; grid-column:1; grid-row:1; min-height:210px; background:#ccc; pointer-events:none; }
    .poster img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
    .poster-top { position:absolute; top:6px; left:6px; display:flex; flex-wrap:wrap; width:64px; z-index:2; }
    .poster-actions { position:absolute; right:6px; top:6px; display:flex; flex-direction:column; gap:4px; z-index:2; }
    .poster-bottom { position:absolute; left:6px; right:6px; bottom:6px; display:flex; z-index:2; }
    .poster-button { pointer-events:auto; display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:2px; background:none; border-radius:5px; flex:none; }
    .poster-button span { display:grid; place-items:center; width:28px; height:28px; border-radius:5px; background:var(--badge,#6b7280); color:white; font-size:15px; line-height:1; font-weight:800; box-shadow:0 2px 5px #0004; }
    .poster-button svg { width:16px; height:16px; }
    .poster-button:active:not(:disabled) { transform:scale(.95); background:none; }
    .poster-button:disabled { opacity:1; color:white; }
    .poster-button.busy span { animation:badge-pulse 1s ease-in-out infinite alternate; }
    .poster-bottom [data-poster="year"] { margin-left:auto; }
    .status-run { display:block; min-height:44px; margin-top:8px; padding:0 8px; background:none; color:var(--blue); }
    .filename-popover p { white-space:pre-wrap; }
    @keyframes badge-pulse { to { opacity:.55; } }
    @media(prefers-reduced-motion:reduce) { .poster-button.busy span { animation:none; } }
    .media-copy { grid-column:2; grid-row:1; min-width:0; padding:12px 12px 6px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
    .media-title { font-size:16px; line-height:1.35; font-weight:650; overflow-wrap:anywhere; }
    .directory-name { color:rgb(22,177,255); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; line-height:1.4; overflow-wrap:anywhere; }
    .tag-row { display:flex; flex-wrap:wrap; align-items:flex-start; gap:4px; }
    .tag { font-size:11px; font-weight:500; line-height:1.25; border-radius:5px; padding:4px 6px; max-width:100%; overflow-wrap:anywhere; color:#696c77; background:#7e829312; border:1px solid #7e82931c; }
    .tag.blue { color:#286fc5; background:#2878e515; border-color:#2878e522; }
    .tag.cyan { color:#047f99; background:#00a6c014; border-color:#00a6c023; }
    .tag.purple { color:#8051bb; background:#905bc513; border-color:#905bc522; }
    .tag.teal { color:#138078; background:#10978b14; border-color:#10978b24; }
    .tag.orange { color:#ba6b16; background:#e3972116; border-color:#e3972126; }
    .tag.red { color:#c23c51; background:#d7465913; border-color:#d7465922; }
    .tag.green { color:#25854e; background:#32905a13; border-color:#32905a22; }
    .inventory-line { font-size:12px; line-height:1.4; color:#c23c51; }
    .inventory-line.complete { color:#25854e; }
    .card-controls { display:flex; align-items:center; margin-top:auto; position:relative; z-index:2; }
    .card-controls button { pointer-events:auto; }
    .source-button { display:flex; align-items:center; gap:4px; min-height:44px; background:none; padding:0; color:var(--blue); font-size:12px; }
    .source-button svg { width:15px; height:15px; }
    .detail-button { margin-left:auto; margin-right:-8px; }
    .source-name { min-width:0; flex:1; font-size:12px; color:var(--muted); line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .filename-popover { position:fixed; inset:auto; margin:0; padding:12px; border:0; border-radius:8px; background:var(--surface); color:var(--text); box-shadow:0 5px 24px #0003; font-size:13px; line-height:1.5; overflow-wrap:anywhere; white-space:normal; max-height:min(60dvh,400px); overflow-y:auto; overscroll-behavior:contain; }
    .filename-popover::backdrop { background:transparent; pointer-events:none; }
    .empty { padding:60px 12px; text-align:center; color:var(--muted); }
    .nav { display:grid; grid-template-columns:repeat(4,1fr); padding:5px 8px calc(6px + env(safe-area-inset-bottom,0px)); flex:none; border-top:1px solid var(--line); background:var(--bar); backdrop-filter:blur(20px); }
    .nav button { background:none; color:var(--muted); min-height:50px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:10px; border-radius:8px; }
    .nav button.active { color:var(--blue); }
    .nav button.active svg { stroke-width:2.4; }
    .metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
    .metric { border-bottom:1px solid var(--line); padding:12px 4px; }
    .metric span { display:block; font-size:12px; color:var(--muted); }
    .metric strong { display:block; font-size:24px; margin-top:6px; }
    .section-heading { font-size:16px; margin:18px 0 12px; }
    .settings-row { padding:16px 4px; border-bottom:1px solid var(--line); font-size:14px; }
    .settings-row span { display:block; margin-top:6px; color:var(--muted); font-size:12px; }
    dialog { width:min(calc(100% - 32px),380px); max-height:80dvh; overflow:auto; margin:auto; padding:22px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text); box-shadow:0 16px 80px #0003; }
    dialog::backdrop { background:#17182065; }
    dialog h2 { font-size:18px; line-height:1.4; margin-bottom:12px; }
    dialog p { font-size:14px; color:var(--muted); line-height:1.6; overflow-wrap:anywhere; }
    .dialog-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; justify-content:flex-end; }
    .dialog-actions button { min-height:44px; padding:8px 16px; border-radius:8px; background:#7e829315; color:var(--blue); }
    .dialog-actions .danger { color:#d94656; }
    .dialog-actions .confirm { background:var(--blue); color:#fff; }
    .dialog-actions .confirm.danger { background:#d94656; color:#fff; }
    .toast { position:fixed; bottom:calc(82px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:#262630; color:#fff; border-radius:8px; padding:11px 16px; font-size:13px; z-index:10; max-width:calc(100% - 32px); pointer-events:none; }
    [hidden] { display:none !important; }
    @media(hover:hover) and (pointer:fine) { button:not(:disabled):hover { background:#7e829310; } }
    @media(hover:hover) and (pointer:fine) { .poster-button:not(:disabled):hover { background:#ffffff26; } }
    @media(prefers-reduced-transparency:reduce) { .controls,.nav { backdrop-filter:none; background:var(--bg); } }
  </style>
</head>
<body>
  <section class="phone" aria-label="手机预览">
    <header>
      <div><h1 id="title">入库管理</h1><p class="subtitle">家里 NAS</p></div>
      <div class="header-actions">
        <button class="icon-button" id="search-toggle" title="搜索" aria-label="搜索"><i data-lucide="search"></i></button>
        <button class="icon-button" id="refresh" title="刷新列表" aria-label="刷新列表"><i data-lucide="refresh-cw"></i></button>
      </div>
    </header>
    <div class="search" id="search-box" hidden><input id="search" type="search" placeholder="搜索媒体" aria-label="搜索媒体"></div>
    <div class="controls" id="controls">
      <div class="selection-toolbar">
        <span class="selection-count" id="selection-count" role="status" aria-live="polite">共 4 项</span>
        <button class="icon-button" id="select-all" title="全选或取消全选" aria-label="全选或取消全选"><i data-lucide="circle-check"></i></button>
        <div class="toolbar-actions" id="toolbar-actions"></div>
        <select id="state" aria-label="状态"></select>
      </div>
    </div>
    <main id="content"></main>
    <nav class="nav" aria-label="页面">
      <button data-tab="overview"><i data-lucide="layout-dashboard"></i>总览</button>
      <button class="active" data-tab="media"><i data-lucide="archive"></i>入库</button>
      <button data-tab="qb"><i data-lucide="download"></i>qB</button>
      <button data-tab="settings"><i data-lucide="settings"></i>设置</button>
    </nav>
  </section>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="filename-popover" class="filename-popover" popover="manual" role="tooltip"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="preview-assets/lucide.min.js"></script>
  <script>
    const media = [
      { id:"media-1", title:"黑狱断肠歌之砌生猪肉", card_summary:{expected_directory:"黑狱断肠歌之砌生猪肉 (1997) - {tmdbid=247999}"}, state:"已识别", tone:"blue", tags:["1080p","华语电影","REMUX@U版","4.7 GB"], source:"Chinese.Midnight.Express.1997.1080p.BluRay.REMUX.mkv", poster:"preview-assets/movie.jpg", existing:0, total:1, folder:true },
      { id:"media-2", title:"火影忍者：疾风传", details:{inventory_plan:{expected_directory:"火影忍者：疾风传 (2007) - {tmdbid=31910}"}}, state:"已识别", tone:"blue", tags:["第一季","1080p","日韩动漫","WEB-DL","128.4 GB","特效"], source:"Naruto.Shippuden.2007.S01.Complete.1080p.WEB-DL.H264.AAC-UBWEB", poster:"preview-assets/naruto.jpg", existing:4, total:14, folder:true },
      { id:"media-3", title:"凡人修仙传", card_summary:{expected_directory:"凡人修仙传 (2020) - {tmdbid=102952}"}, state:"待入库", tone:"purple", tags:["第四季","2160p","国产动漫","WEB-DL","32.4 GB"], source:"A.Record.of.a.Mortals.Journey.to.Immortality.2025.S04.Complete.2160p.mkv", poster:"preview-assets/series.jpg", existing:0, total:12, folder:false },
      { id:"media-4", title:"抓特务", target_name:"抓特务 (2026)", state:"已入库", tone:"green", tags:["2160p","华语电影","WEB-DL","6.2 GB"], source:"Catch.the.Spy.2026.2160p.WEB-DL.mkv", poster:"preview-assets/spy.jpg", existing:1, total:1, folder:true }
    ];
    const torrents = [
      { id:"qb-1", title:"凡人修仙传", details:{inventory_plan:{expected_directory:"凡人修仙传 (2020) - {tmdbid=102952}"}}, state:"已识别", tone:"blue", tags:["下载中","68%","2160p","国产动漫","32.4 GB"], source:"A.Record.of.a.Mortals.Journey.to.Immortality.2025.S04.2160p.mkv", poster:"preview-assets/series.jpg",existing:0,total:8,folder:false },
      { id:"qb-2", title:"火影忍者：疾风传", card_summary:{expected_directory:"火影忍者：疾风传 (2007) - {tmdbid=31910}"}, state:"已识别", tone:"blue", tags:["已完成","100%","1080p","日韩动漫","128.4 GB"], source:"Naruto.Shippuden.2007.S01.Complete.1080p.WEB-DL.H264.AAC-UBWEB", poster:"preview-assets/naruto.jpg",existing:4,total:14,folder:true }
    ];
    const analysis=(state,completed,total,extra={})=>({state,completed,total,...extra});
    Object.assign(media[0],{media_type:"movie",source_url:"https://example.com/details/247999",tmdb_id:247999,
      details:{sha1_status:analysis("ready",1,1),media_analysis:{enabled:true,metadata:analysis("ready",1,1),intro:analysis("not_applicable",0,0)}},
      year_check:{state:"match",source_years:[1997],expected_year:1997}});
    Object.assign(media[1],{media_type:"tv",source_url:"https://example.com/details/31910",tmdb_id:31910,
      details:{...media[1].details,sha1_status:analysis("ready",10,10,{skipped:4}),
        media_analysis:{enabled:true,intro_enabled:true,metadata:analysis("ready",10,10),intro:analysis("no_intro",10,10,{matched:9,unmatched:1})}},
      year_check:{state:"match",source_years:[2007],expected_year:2007,season:1}});
    Object.assign(media[2],{media_type:"tv",tmdb_id:102952,failure:"有一个源文件暂时无法读取",
      details:{sha1_status:analysis("failed",11,12,{failed:1,error:"有一个源文件暂时无法读取"}),
        media_analysis:{enabled:true,intro_enabled:true,metadata:analysis("failed",11,12,{error:"有一个文件读取失败"}),intro:analysis("pending",0,12)}},
      year_check:{state:"mismatch",source_years:[2025],expected_year:2024,season:4}});
    Object.assign(media[3],{media_type:"movie",tmdb_id:123456,
      details:{sha1_status:analysis("ready",1,1),media_analysis:{enabled:true,metadata:analysis("ready",1,1)}}});
    media.push({id:"media-5",title:"茜茜皇后",media_type:"tv",tmdb_id:131488,state:"已回退",tone:"blue",
      failure:"CD2 连续 60 秒无响应",tags:["第二季","1080p","欧美剧","WEB-DL","9.8 GB"],
      card_summary:{expected_directory:"茜茜皇后 (2022) - {tmdbid=131488}"},source:"The.Empress.2024.S02.1080p.WEB-DL.mkv",
      poster:"preview-assets/series.jpg",existing:0,total:6,folder:false,details:{sha1_status:analysis("ready",6,6),
        media_analysis:{enabled:true,intro_enabled:true,metadata:analysis("ready",6,6),intro:analysis("ready",6,6,{matched:6,unmatched:0})}},
      year_check:{state:"match",source_years:[2024],expected_year:2024,season:2}});
    Object.assign(torrents[0],{media_type:"tv",tmdb_id:102952,year_check:{state:"unknown"},details:{...torrents[0].details}});
    Object.assign(torrents[1],{media_type:"tv",tmdb_id:31910,media_id:"media-2",source_url:"https://example.com/details/31910",
      details:{...media[1].details}});
    let tab="media", state="", search="", toastTimer;
    let runningAnalysis=null;
    const selected=new Set();
    let filenameAnchor=null;
    const $=selector=>document.querySelector(selector);
    const icons=()=>window.lucide?.createIcons();
    const escapeText=text=>String(text).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const stateKey=()=>`rssallinone.preview.filters.${tab}.state`;
    function savedState() {
      try { return localStorage.getItem(stateKey())||""; } catch { return ""; }
    }
    function saveState() {
      try { localStorage.setItem(stateKey(),state); } catch {}
    }
    const records=()=>tab==="qb"?torrents:media;
    const directoryName=item=>[item.card_summary?.expected_directory,item.details?.inventory_plan?.expected_directory,item.target_name].find(value=>typeof value==="string"&&value.trim())||"";
    const visible=()=>records().filter(item=>(!state||item.state===state) && (!search||`${item.title} ${item.source}`.toLowerCase().includes(search.toLowerCase())));
    const selectedRows=()=>visible().filter(item=>selected.has(item.id));
    function iconButton(action,label,icon,danger=false) {
      return `<button class="icon-button ${danger?"danger":""}" data-action="${action}" title="${label}" aria-label="${label}"><i data-lucide="${icon}"></i></button>`;
    }
    function can(action) {
      const rows=selectedRows();
      if (!rows.length) return false;
      if (tab==="qb") return action==="delete-qb";
      if (action==="queue") return rows.every(item=>["已识别","已回退"].includes(item.state));
      if (["import","force_upload"].includes(action)) return rows.every(item=>["已识别","待入库","已回退"].includes(item.state));
      if (action==="delete-source") return rows.every(item=>!["已入库","入库中"].includes(item.state));
      if (["inventory","delete-links","delete-both"].includes(action)) return rows.every(item=>item.state==="已入库");
      return false;
    }
    function toolbar() {
      const n=selectedRows().length;
      $("#selection-count").textContent=n?`已选 ${n} 项`:`共 ${visible().length} 项`;
      $("#selection-count").classList.toggle("has-selection",n>0);
      $("#select-all").disabled=!visible().length;
      $("#select-all").setAttribute("aria-pressed",String(visible().length>0 && visible().every(item=>selected.has(item.id))));
      $("#toolbar-actions").innerHTML=tab==="qb"
        ?iconButton("delete-qb","删除 qB 任务","trash-2",true)
        :iconButton("queue","转待入库","inbox")+iconButton("import","入库","archive")+iconButton("force_upload","强制入库","circle-arrow-up")+iconButton("delete-source","删源","trash-2",true);
      $("#toolbar-actions").querySelectorAll("[data-action]").forEach(button=>button.disabled=!can(button.dataset.action));
      icons();
    }
    function tagTone(tag) {
      if (/^\d{3,4}p$/i.test(tag)) return "cyan";
      if (/电影|剧|动漫|^第.+季$|^特别篇/.test(tag)) return "purple";
      if (/REMUX|WEB|特效/.test(tag)) return "teal";
      if (tag==="国配") return "red";
      if (tag==="下载中") return "orange";
      if (tag==="已完成") return "green";
      return "";
    }
    function statusInfo(item,kind) {
      if(kind==="year") {
        const check=item.year_check||{};
        return {color:check.state==="match"?"#15803d":check.state==="mismatch"?"#dc2626":"#6b7280",
          message:`年份${({match:"一致",mismatch:"不一致"})[check.state]||"无法核对"}：文件 ${(check.source_years||[]).join("、")||"未识别"} / ${check.season!=null?`第 ${check.season} 季 `:""}识别 ${check.expected_year||"未识别"}`};
      }
      const stage=(kind==="sha1"?item.details?.sha1_status:item.details?.media_analysis?.[kind])||{};
      const state=kind==="intro"&&item.media_type==="movie"?"not_applicable":stage.state;
      const name=({sha1:"SHA1",metadata:"媒体信息",intro:"片头"})[kind];
      const message=kind==="sha1"?({ready:"计算完成",failed:"计算失败"})[state]||"尚未计算完成"
        :({ready:"提取成功",failed:"提取失败",not_applicable:"电影无需提取片头",disabled:"未启用片头检测"})[state]||"等待提取或尚未全部完成";
      let progress=stage.total&&!["not_applicable","disabled"].includes(state)
        ?kind==="intro"?`已检测 ${stage.completed||0}/${stage.total} · 匹配 ${stage.matched||0} · 未匹配 ${stage.unmatched||0}`
        :`${message}（${stage.completed||0}/${stage.total} 个文件）`:message;
      if(stage.skipped) progress+=`；库存已存在，跳过 ${stage.skipped}`;
      if(stage.error) progress+=`；${stage.error}`;
      return {color:state==="ready"?"#15803d":state==="failed"?"#dc2626":"#6b7280",message:`${name}：${progress}`};
    }
    function canAnalyze(item,kind) {
      return ["metadata","intro"].includes(kind)&&!runningAnalysis&&(tab!=="qb"||item.media_id)
        &&item.state!=="入库中"&&item.details?.media_analysis?.enabled!==false
        &&(kind!=="intro"||(item.media_type!=="movie"&&item.details?.media_analysis?.intro_enabled!==false
          &&!["not_applicable","disabled"].includes(item.details?.media_analysis?.intro?.state)));
    }
    function posterButton(item,action,letter,label,color="#6b7280",disabled=false,icon="") {
      const running=runningAnalysis?.id===item.id&&runningAnalysis?.kind===action;
      return `<button class="poster-button ${running?"busy":""}" style="--badge:${color}" data-poster="${action}" data-record="${item.id}"
        title="${escapeText(label)}" aria-label="${escapeText(label)}" ${running?'aria-busy="true"':""} ${disabled?"disabled":""}>
        <span>${icon?`<i data-lucide="${icon}"></i>`:letter}</span></button>`;
    }
    function posterControls(item) {
      const top=posterButton(item,"source","P",item.source_url?"打开来源页面":"未获取到来源链接",item.source_url?"#f29a2e":"#6b7280")
        +posterButton(item,"tmdb","T",item.tmdb_id?"打开 TMDB":"未获取到 TMDB 链接",item.tmdb_id?"#20b7cf":"#6b7280")
        +(item.state==="已回退"?posterButton(item,"failure","R",item.failure||"已回退","#8456e8")
          :item.failure?posterButton(item,"failure","!",item.failure,"#df3c4f"):"");
      const controls=(tab!=="qb"&&item.state==="待入库"?posterButton(item,"delete","","删除插件记录","#050a0fc7",false,"x"):"")
        +posterButton(item,"refresh","","刷新","#050a0fc7",item.state==="入库中","refresh-cw")
        +(item.state!=="已入库"?posterButton(item,"edit","","人工识别","#050a0fc7",false,"pencil"):"")
        +(["已识别","已存在","已回退"].includes(item.state)?posterButton(item,"unidentify","","移入未识别","#050a0fc7",false,"circle-help"):"");
      const bottom=[["sha1","S"],["metadata","M"],["intro","I"],["year","Y"]].map(([kind,letter])=>{
        const info=statusInfo(item,kind);
        return posterButton(item,kind,letter,info.message,info.color);
      }).join("");
      return `<div class="poster-top">${top}</div><div class="poster-actions">${controls}</div><div class="poster-bottom">${bottom}</div>`;
    }
    function mediaRow(item) {
      const picked=selected.has(item.id);
      const directory=directoryName(item);
      return `<article class="media-row ${picked?"selected":""}" data-id="${item.id}">
        <button class="card-select" data-select="${item.id}" aria-label="选择：${escapeText(item.title)}" aria-pressed="${picked}"></button>
        <div class="poster"><img src="${item.poster}" alt="" loading="eager">${posterControls(item)}</div>
        <div class="media-copy">
          <h2 class="media-title">${escapeText(item.title)}</h2>
          <div class="tag-row"><span class="tag ${item.tone}">${item.state==="已回退"?"已识别":item.state}</span>${item.tags.map(tag=>`<span class="tag ${tagTone(tag)}">${escapeText(tag)}</span>`).join("")}</div>
          ${directory?`<p class="directory-name">${escapeText(directory)}</p>`:""}
          ${item.total&&item.state!=="已入库"?`<div class="inventory-line ${item.folder?"complete":""}">${item.folder?"目录已存在":"目录未建立"}（${item.existing}/${item.total}）</div>`:""}
          <div class="card-controls"><p id="source-${item.id}" class="source-name">${escapeText(item.source)}</p>
            <button class="icon-button detail-button" data-filename="${item.id}" aria-label="完整文件名：${escapeText(item.title)}" aria-expanded="false" aria-controls="filename-popover" aria-describedby="filename-popover"><i data-lucide="info"></i></button></div>
        </div>
      </article>`;
    }
    function renderList() {
      closeFilename();
      const scroll=$("#content").scrollTop;
      $("#content").innerHTML=visible().map(mediaRow).join("")||'<p class="empty">暂无记录</p>';
      $("#content").scrollTop=scroll;
      toolbar();
    }
    function page(next) {
      closeFilename();
      tab=next; state=savedState(); search=""; selected.clear();
      $("#state").innerHTML=["",...(tab==="qb"?["已识别","未识别"]:["已识别","未识别","待入库","已入库","已存在","已回退"])].map(value=>`<option value="${value}">${value||"全部"}</option>`).join("");
      if (![...$("#state").options].some(option=>option.value===state)) state="";
      $("#state").value=state;
      $("#search").value=""; $("#search-box").hidden=true;
      $("#title").textContent=({media:"入库管理",qb:"qB 管理",overview:"总览",settings:"设置"})[tab];
      $("#controls").hidden=!["media","qb"].includes(tab);
      $("#search-toggle").hidden=!["media","qb"].includes(tab);
      document.querySelectorAll(".nav button").forEach(button=>button.classList.toggle("active",button.dataset.tab===tab));
      $("#content").scrollTop=0;
      if (["media","qb"].includes(tab)) renderList();
      else if (tab==="overview") {
        $("#content").innerHTML=`<div class="metric-grid"><div class="metric"><span>媒体记录</span><strong>${media.length}</strong></div><div class="metric"><span>qB 任务</span><strong>${torrents.length}</strong></div><div class="metric"><span>待入库</span><strong>${media.filter(item=>item.state==="待入库").length}</strong></div><div class="metric"><span>运行状态</span><strong>就绪</strong></div></div>`;
      } else $("#content").innerHTML='<div class="settings-row">实例<span>家里 NAS</span></div><div class="settings-row">预览数据<span>本页操作只影响演示记录</span></div><button class="source-button" id="reset-demo">重新加载演示数据</button>';
      icons();
    }
    function showToast(text) {
      clearTimeout(toastTimer); $("#toast").textContent=text; $("#toast").hidden=false;
      toastTimer=setTimeout(()=>$("#toast").hidden=true,2200);
    }
    function closeFilename() {
      const popover=$("#filename-popover");
      if(popover.matches(":popover-open")) popover.hidePopover();
      filenameAnchor?.setAttribute("aria-expanded","false");
      filenameAnchor=null;
    }
    function showFilename(button,item,content=null) {
      if(filenameAnchor===button) return closeFilename();
      closeFilename();
      const popover=$("#filename-popover");
      filenameAnchor=button;
      button.setAttribute("aria-expanded","true");
      if(content===null) popover.textContent=item.source;
      else popover.innerHTML=content;
      const phone=$(".phone").getBoundingClientRect();
      const anchor=button.getBoundingClientRect();
      const width=Math.min(300,phone.width-24,innerWidth-24);
      popover.style.width=`${width}px`;
      popover.showPopover();
      const height=popover.getBoundingClientRect().height;
      const left=Math.max(phone.left+12,Math.min(anchor.right-width,phone.right-width-12));
      const top=anchor.top-height-8>=12?anchor.top-height-8:Math.min(anchor.bottom+8,innerHeight-height-12);
      popover.style.left=`${left}px`;
      popover.style.top=`${Math.max(12,top)}px`;
    }
    function posterClick(button,item,action) {
      if(["sha1","metadata","intro","year"].includes(action)) {
        const info=statusInfo(item,action);
        return showFilename(button,item,`<p>${escapeText(info.message)}</p>${canAnalyze(item,action)
          ?`<button class="status-run" data-run-analysis="${action}" data-record="${item.id}">重新提取</button>`:""}`);
      }
      if(action==="source"||action==="tmdb") {
        const url=action==="source"?item.source_url:item.tmdb_id?`https://www.themoviedb.org/${item.media_type==="movie"?"movie":"tv"}/${item.tmdb_id}`:"";
        if(url) return showFilename(button,item,`<p>${action==="source"?"来源页面":"TMDB 页面"}</p><p>${escapeText(url)}</p>`);
        return showFilename(button,item,`<p>${action==="source"?"未获取到来源链接":"未获取到 TMDB 链接"}</p>`);
      }
      if(action==="failure") return showFilename(button,item,`<p>${escapeText(item.failure||"已回退")}</p>`);
      if(action==="refresh") return showToast("已刷新演示卡片");
      if(action==="edit") return dialog("人工识别",`<p>${escapeText(item.title)}</p>
        <p style="margin-top:12px"><label>分类 <select id="edit-category">${["外语电影","华语电影","欧美剧","日韩动漫","国产动漫"].map(category=>`<option ${item.tags.includes(category)?"selected":""}>${category}</option>`).join("")}</select></label></p>
        <p><label><input type="checkbox" id="edit-mandarin" ${item.tags.includes("国配")?"checked":""}> 国配</label>
        <label><input type="checkbox" id="edit-effects" ${item.tags.includes("特效")?"checked":""}> 特效</label></p>`,
        `<button data-close>取消</button><button class="confirm" data-poster-confirm="edit" data-record="${item.id}">确认</button>`);
      dialog(action==="delete"?"删除插件记录":"移入未识别",`<p>${escapeText(item.title)}${action==="delete"?"：仅移除记录，保留文件。":""}</p>`,
        `<button data-close>取消</button><button class="confirm ${action==="delete"?"danger":""}" data-poster-confirm="${action}" data-record="${item.id}">确认</button>`);
    }
    async function runAnalysis(item,kind) {
      if(!canAnalyze(item,kind)) return;
      closeFilename();
      runningAnalysis={id:item.id,kind};renderList();showToast("正在逐文件提取（演示）");
      await new Promise(resolve=>setTimeout(resolve,1200));
      item.details??={};item.details.media_analysis??={enabled:true,intro_enabled:true};
      item.details.media_analysis[kind]=analysis("ready",item.total,item.total,kind==="intro"?{matched:item.total,unmatched:0}:{});
      runningAnalysis=null;
      if(["media","qb"].includes(tab)) renderList();
      showToast("提取完成（演示）");
    }
    function dialog(title,body,buttons) {
      closeFilename();
      $("#dialog").innerHTML=`<h2 id="dialog-title">${escapeText(title)}</h2>${body}<div class="dialog-actions">${buttons}</div>`;
      icons(); $("#dialog").showModal();
    }
    function batchAction(action) {
      if (!can(action)) return;
      const title=({"queue":"转待入库","import":"入库","force_upload":"强制入库","delete-source":"删除源文件","delete-qb":"删除 qB 任务","delete-links":"删除硬链接","delete-both":"删除源文件和硬链接"})[action];
      const danger=action.startsWith("delete");
      const message=action==="force_upload"?`对选中的 ${selectedRows().length} 项优先尝试秒传，无法秒传时继续真实上传。`:action==="delete-qb"?"删除选中的 qB 任务，保留下载文件。":danger?"删除选中记录对应的文件。此预览仅操作演示数据。":`对选中的 ${selectedRows().length} 项执行${title}？`;
      if ($("#dialog").open) $("#dialog").close();
      dialog(`${title} · ${selectedRows().length} 项`,`<p>${message}</p>`,`<button data-close>取消</button><button class="confirm ${danger?"danger":""}" data-execute="${action}">确认${title}</button>`);
    }
    function execute(action) {
      if (!can(action)) return;
      const rows=selectedRows(), n=rows.length;
      if (action==="queue") rows.forEach(item=>{item.state="待入库";item.tone="purple";});
      if (["import","force_upload"].includes(action)) rows.forEach(item=>{item.state="已入库";item.tone="green";item.existing=item.total;item.folder=true;});
      if (["delete-qb","delete-source","delete-both"].includes(action)) {
        const list=records(); for (let index=list.length-1;index>=0;index--) if (selected.has(list[index].id)) list.splice(index,1);
      }
      if (action==="delete-links") rows.forEach(item=>{item.state="已回退";item.tone="red";});
      selected.clear(); $("#dialog").close(); renderList(); showToast(`已处理 ${n} 项`);
    }
    document.addEventListener("click",event=>{
      const button=event.target.closest("button"); if(!button||button.disabled) return;
      if(button.dataset.poster) {
        const item=records().find(row=>row.id===button.dataset.record);
        if(item) return posterClick(button,item,button.dataset.poster);
      }
      if(button.dataset.runAnalysis) {
        const item=records().find(row=>row.id===button.dataset.record);
        if(item) return runAnalysis(item,button.dataset.runAnalysis);
      }
      if(button.dataset.posterConfirm) {
        const item=records().find(row=>row.id===button.dataset.record);
        if(!item) return;
        const action=button.dataset.posterConfirm;
        if(action==="delete") {records().splice(records().indexOf(item),1);selected.delete(item.id);}
        if(action==="unidentify") {item.state="未识别";item.tone="red";selected.delete(item.id);}
        if(action==="edit") {
          item.tags=item.tags.filter(tag=>!["国配","特效"].includes(tag)&&!(/电影|剧|动漫/.test(tag)));
          item.tags.splice(1,0,$("#edit-category").value);
          if($("#edit-mandarin").checked) item.tags.push("国配");
          if($("#edit-effects").checked) item.tags.push("特效");
        }
        $("#dialog").close();renderList();return showToast("已更新演示记录");
      }
      if(button.dataset.tab) return page(button.dataset.tab);
      if(button.dataset.select) {
        const key=button.dataset.select; selected.has(key)?selected.delete(key):selected.add(key); return renderList();
      }
      if(button.dataset.filename) {
        const item=records().find(row=>row.id===button.dataset.filename);
        return showFilename(button,item);
      }
      if(button.dataset.action) return batchAction(button.dataset.action);
      if(button.dataset.execute) return execute(button.dataset.execute);
      if(button.dataset.confirm) return batchAction(button.dataset.confirm);
      if(button.hasAttribute("data-close")) return $("#dialog").close();
      if(button.id==="clear-selection") {selected.clear();$("#dialog").close();return renderList();}
      if(button.id==="select-all") {
        const rows=visible(); if(rows.every(item=>selected.has(item.id))) selected.clear(); else rows.forEach(item=>selected.add(item.id)); return renderList();
      }
      if(button.id==="search-toggle") {$("#search-box").hidden=!$("#search-box").hidden;if(!$("#search-box").hidden) $("#search").focus();}
      if(button.id==="refresh") {selected.clear();if(["media","qb"].includes(tab)) renderList();showToast("已刷新演示记录");}
      if(button.id==="reset-demo") location.reload();
    });
    $("#state").addEventListener("change",event=>{state=event.target.value;saveState();selected.clear();renderList();});
    $("#search").addEventListener("input",event=>{search=event.target.value;selected.clear();renderList();});
    document.addEventListener("pointerdown",event=>{
      if(filenameAnchor&&!filenameAnchor.contains(event.target)&&!$("#filename-popover").contains(event.target)) closeFilename();
    });
    document.addEventListener("keydown",event=>{
      if(event.key==="Escape"&&filenameAnchor) {const anchor=filenameAnchor;closeFilename();anchor.focus();}
    });
    $("#content").addEventListener("scroll",closeFilename,{passive:true});
    window.addEventListener("resize",closeFilename);
    page("media");
  </script>
</body>
</html>
