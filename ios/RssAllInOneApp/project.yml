name: RssAllInOneApp
options:
  bundleIdPrefix: com.rssallinone
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  RssAllInOneApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rssallinone.app
        INFOPLIST_KEY_CFBundleDisplayName: RSS一条龙
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 用于连接局域网中的 MoviePilot 服务
        INFOPLIST_KEY_NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
    scheme:
      gatherCoverageData: false
      shared: true
  RssAllInOneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RssAllInOneApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  RssAllInOneApp:
    build:
      targets:
        RssAllInOneApp: all
        RssAllInOneTests: [test]
    test:
      targets:
        - RssAllInOneTests
